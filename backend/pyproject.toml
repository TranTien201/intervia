[project]
name = "intervia-backend"
version = "0.1.0"
description = "Intervia backend: API + AI interviewer"
authors = [
    { name = "Tran Tien", email = "tiennguyentran201@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.13",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "llama-cloud>=2.18.0",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
